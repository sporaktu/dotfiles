# tuios is the primary multiplexer; kitty and ghostty both launch a plain `tuios`.
# Stowed from the dotfiles, so changes made in the settings page land here too.
# Must stay above the first table. local.toml is untracked, per-machine, optional.
include = ["?local.toml"]

[appearance]
theme = "catppuccin_frappe"
theme_light = "catppuccin_latte"
# Named explicitly: restored shells otherwise take $SHELL from the daemon's environment.
preferred_shell = "fish"
glyphs = "default"
border_style = "rounded"
frame_panels = false
pane_overlays = true
overlay_border_color = "#52d9c6"
window_title_style = "tab"
window_title_align = "auto"
shared_borders = false
window_button_style = "dots"
gap = 0
tiling_scheme = "spiral"
# Master-stack (see [startup] layout): the main pane keeps this share of the width
# and every other pane stacks beside it, so agent panes shrink instead of the main one.
master_ratio = 60
# Off: the default shows four or more panes as a grid instead of one main pane and a stack.
master_grid = false
popup_dim = 0

# Dev VM sessions: "devvm 2" (running Claude sessions per machine) refreshed every 30s; click to pick one.
# The default right side, with the VM cell first.
[dock]
right = ["custom/devvm", "transfers", "notifications", "copy-help", "cpu", "ram", "clock", "session-controls"]

[dock.custom.devvm]
command = "~/.config/tuios/scripts/devvm-sessions.sh dock"
refresh = "30s"
on-click = "~/.config/tuios/scripts/devvm-sessions.sh pick"

[startup]
daemon = true
tiled = true
# New sessions only; a workspace that already exists keeps its layout until
# leader, space cycles it (BSP, master-stack, scrolling).
layout = "master-stack"
# Plain `tuios` attaches to this session, creating it if needed (tmux new -A -s main).
session = "main"
start_in_terminal_mode = true
open_default_window = true

[keybindings]
# tmux keys after the leader. A tmux window is a workspace, a tmux pane is a window.
# Tuios features displaced by the preset live under leader, then ctrl+t.
preset = "tmux"
leader_key = "ctrl+space"

# Carried over from tmux.conf: leader + hjkl resizes by 5.
[keybindings.prefix_mode]
resize_pane_left_5 = ["h"]
resize_pane_down_5 = ["j"]
resize_pane_up_5 = ["k"]
resize_pane_right_5 = ["l"]

# Dev VM: new window that handles az login, VM start, VPN and the SSH cert, then lands in a shell
[[keybindings.command]]
key = "prefix+ctrl+v"
type = "shell"
command = "~/.config/tuios/scripts/devvm-win.sh"
description = "New window on the dev VM"

# Dev VM sessions: pick a running Claude session on the VM(s) and reopen it (enter: new workspace, ctrl-p: pane)
[[keybindings.command]]
key = "prefix+ctrl+a"
type = "shell"
command = "~/.config/tuios/scripts/devvm-sessions.sh pick"
description = "Reopen a Claude session on the dev VM"
