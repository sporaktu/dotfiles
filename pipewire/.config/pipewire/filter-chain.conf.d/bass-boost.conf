# Bass boost for the Mackie CR8S-XBT sub on the EVGA NU Audio.
# Enable on a new machine: stow --target=$HOME pipewire && systemctl --user enable --now filter-chain
# then pick "Speakers + Bass Boost" as the default output.
# mud_cut / harsh_cut / treble_shelf tame the Mackie CR3s' mids and highs.
# bass_shelf boosts the sub's deep bass; upper_bass_cut tames the
# CR3s' ~110 Hz bass bump where they overlap the sub. Keep preamp Mult
# at roughly 10^(-shelf gain/20) so loud bass doesn't clip, then:
#   systemctl --user restart filter-chain
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers + Bass Boost"
            media.name       = "Speakers + Bass Boost"
            filter.graph = {
                nodes = [
                    {
                        # -8 dB headroom for the boosts below
                        type  = builtin
                        name  = preamp
                        label = linear
                        control = { "Mult" = 0.398 "Add" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = bass_shelf
                        label = bq_lowshelf
                        control = { "Freq" = 50.0 "Q" = 0.7 "Gain" = 7.0 }
                    }
                    {
                        # kick-drum "thump"
                        type  = builtin
                        name  = thump
                        label = bq_peaking
                        control = { "Freq" = 70.0 "Q" = 1.4 "Gain" = 3.0 }
                    }
                    {
                        type  = builtin
                        name  = upper_bass_cut
                        label = bq_peaking
                        control = { "Freq" = 110.0 "Q" = 0.8 "Gain" = -8.0 }
                    }
                    {
                        type  = builtin
                        name  = mud_cut
                        label = bq_peaking
                        control = { "Freq" = 300.0 "Q" = 1.0 "Gain" = -2.0 }
                    }
                    {
                        # CR3 woofer ringing at ~5.5 kHz (noaudiophile.com measurements)
                        type  = builtin
                        name  = harsh_cut
                        label = bq_peaking
                        control = { "Freq" = 5500.0 "Q" = 2.0 "Gain" = -3.0 }
                    }
                    {
                        # CR3 treble rises to ~18 kHz; pull it back
                        type  = builtin
                        name  = treble_shelf
                        label = bq_highshelf
                        control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = -3.0 }
                    }
                ]
                links = [
                    { output = "preamp:Out" input = "bass_shelf:In" }
                    { output = "bass_shelf:Out" input = "thump:In" }
                    { output = "thump:Out" input = "upper_bass_cut:In" }
                    { output = "upper_bass_cut:Out" input = "mud_cut:In" }
                    { output = "mud_cut:Out" input = "harsh_cut:In" }
                    { output = "harsh_cut:Out" input = "treble_shelf:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.bass_boost"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name     = "effect_output.bass_boost"
                node.passive  = true
                target.object = "alsa_output.usb-EVGA_Corporation_EVGA_NU_Audio-00.analog-surround-40"
            }
        }
    }
]
